apiVersion: apps/v1
kind: Deployment
metadata:
  name: atom-store-service
  labels:
    app: atom-store-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atom-store-service
  template:
    metadata:
      labels:
        app: atom-store-service
    spec:
      containers:
      - name: atom-store-service
        image: atom-store-service:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atom-store-service
spec:
  selector:
    app: atom-store-service
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: LoadBalancer
