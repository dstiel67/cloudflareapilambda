apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-flags-service
  labels:
    app: read-flags-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: read-flags-service
  template:
    metadata:
      labels:
        app: read-flags-service
    spec:
      containers:
      - name: read-flags-service
        image: read-flags-service:latest
        env:
        - name: DYNAMODB_TABLE_NAME
          value: "failover-status"
        - name: ATOM_STORE_URL
          value: "http://atom-store-service:3000"
        - name: POLLING_INTERVAL
          value: "10"
        - name: AWS_REGION
          value: "us-east-1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: read-flags-service
spec:
  selector:
    app: read-flags-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
